name: Gerar APK MonitorRFID

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java Estavel
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias e ImageMagick
        run: |
          python -m pip install --upgrade pip
          pip install flet
          # Instala ferramenta do Linux para converter imagens na marra
          sudo apt-get update
          sudo apt-get install -p imagemagick -y

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Forçar a Compilação do APK
        run: |
          flutter config --no-analytics
          flet clean
          
          # FORÇAR FORMATAÇÃO: Converte sua logo para PNG Quadrado 512x512 perfeito
          mkdir -p assets
          convert assets/icons/logo.png -resize 512x512\! assets/icon.png
          
          # Executa o build com o ícone forçado e corrigido
          flet build apk --yes --verbose --android-adaptive-icon-background "#0E0E55"

      - name: Disponibilizar o arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
