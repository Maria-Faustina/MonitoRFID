name: Gerar APK MonitorRFID

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java Estavel
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias do Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Forçar a Compilação do APK
        run: |
          flutter config --no-analytics
          # 1. Garante que limpamos qualquer cache temporário gerado no Git
          flet clean
          
          # 2. Copia o seu logo para a raiz padrão que o Flet exige no Linux (icon.png)
          mkdir -p assets
          cp assets/icons/logo.png assets/icon.png
          
          # 3. Força as propriedades via injeção direta de linha de comando CLI
          flet build apk --yes --verbose --android-adaptive-icon-background "#0E0E55"

      - name: Disponibilizar o arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
