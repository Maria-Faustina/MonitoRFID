name: Gerar APK MonitorRFID

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java Estavel
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias do Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet pillow

      - name: Configurar o Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'

      - name: Ajustar e Forçar o Ícone em PNG
        run: |
          # Cria a pasta assets se não existir
          mkdir -p assets
          
          # Script Python que abre sua logo e salva como um PNG quadrado perfeito (512x512)
          python -c "
          from PIL import Image
          import os
          if os.path.exists('assets/icons/logo.png'):
              img = Image.open('assets/icons/logo.png').convert('RGBA')
              img = img.resize((512, 512), Image.Resampling.LANCZOS)
              img.save('assets/icon.png', 'PNG')
              print('Ícone processado com sucesso em assets/icon.png')
          else:
              print('AVISO: assets/icons/logo.png não foi encontrada!')
          "

      - name: Forçar a Compilação do APK
        run: |
          flutter config --no-analytics
          flet clean
          # Executa o build com o ícone embutido e a cor de fundo adaptativa do Android
          flet build apk --yes --verbose --android-adaptive-icon-background "#0E0E55"

      - name: Disponibilizar o arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
