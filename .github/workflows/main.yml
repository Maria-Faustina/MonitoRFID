name: Gerar APK MonitorRFID

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar o Flet (mesma versao do pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install "flet==1.0.5" pillow

      - name: Conferir arquivos do projeto
        run: |
          ls -la
          cat pyproject.toml
          ls requirements.txt 2>/dev/null && echo "ATENCAO: existe requirements.txt" || true

      - name: Gerar icone PNG quadrado
        run: |
          mkdir -p assets
          python -c "
          from PIL import Image
          import os
          if os.path.exists('assets/icons/logo.png'):
              img = Image.open('assets/icons/logo.png').convert('RGBA')
              img = img.resize((512, 512), Image.Resampling.LANCZOS)
              img.save('assets/icon.png', 'PNG')
              print('Icone processado em assets/icon.png')
          else:
              print('AVISO: assets/icons/logo.png nao encontrada!')
          "

      - name: Compilar o APK
        run: |
          flet build apk --yes --verbose --android-adaptive-icon-background "#0E0E55"

      - name: Disponibilizar o arquivo APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
          if-no-files-found: error
