name: Gerar APK MonitorRFID

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java Estável
        uses: actions/setup-java@v5   # Atualizado para v5 para remover o aviso amarelo
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Montar o APK do Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
