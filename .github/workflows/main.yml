name: Gerar APK Pymonitor

on:
  workflow_dispatch: # Permite iniciar a compilação com um clique

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java Estável
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Montar o APK do Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
